global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka-gateway'
    static_configs:
      - targets: ['kafka-gateway:8000']

  - job_name: 'spark-manager'
    static_configs:
      - targets: ['spark-manager:8000']

  - job_name: 'spark-master'
    static_configs:
      - targets: ['spark-master:8080']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka1:19092']
